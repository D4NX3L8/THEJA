<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THEJA | Registro de Ventas</title>
  <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-theja sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="img/logo.png" alt="THEJA" class="logo-theja"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav" aria-controls="menuNav" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li><li class="nav-item"><a class="nav-link active" href="ventas.html"><i class="bi bi-cart-plus me-1"></i>Ventas</a></li><li class="nav-item"><a class="nav-link" href="inventario.html"><i class="bi bi-boxes me-1"></i>Inventario</a></li><li class="nav-item"><a class="nav-link" href="procesamiento.html"><i class="bi bi-stack me-1"></i>Procesamiento</a></li><li class="nav-item"><a class="nav-link" href="empleados.html"><i class="bi bi-people me-1"></i>Empleados</a></li><li class="nav-item"><a class="nav-link" href="manual.html"><i class="bi bi-journal-text me-1"></i>Manual</a></li>
      </ul>
    </div>
  </div>
</nav>

  <main class="container py-4">
    <h2 class="page-title mb-4"><i class="bi bi-cart-plus me-2"></i>Registro de Ventas</h2>

    <div class="row g-3">
      <div class="col-lg-5">
        <div class="card">
          <div class="card-header"><i class="bi bi-pencil-square me-2"></i>Nueva venta</div>
          <div class="card-body">
            <form id="formVenta" novalidate>
              <div class="mb-3">
                <label class="form-label">Producto</label>
                <select class="form-select" id="selProducto" required>
                  <option value="" selected disabled>Cargando productos...</option>
                </select>
              </div>
              <div id="infoProducto" class="alert alert-info py-2 small d-none"></div>
              <div class="row">
                <div class="col-6 mb-3">
                  <label class="form-label">Cantidad</label>
                  <input type="number" class="form-control" id="inpCantidad" min="1" value="1" required>
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">Total estimado</label>
                  <input type="text" class="form-control" id="inpTotal" readonly>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Cliente</label>
                <input type="text" class="form-control" id="inpCliente" placeholder="Nombre del cliente (opcional)">
              </div>
              <div class="mb-3">
                <label class="form-label">Vendedor</label>
                <select class="form-select" id="selVendedor">
                  <option value="" selected>Sin asignar</option>
                </select>
              </div>
              <button type="submit" class="btn btn-theja w-100">
                <i class="bi bi-check-circle me-1"></i>Registrar venta
              </button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card">
          <div class="card-header"><i class="bi bi-table me-2"></i>Últimas ventas registradas</div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-theja table-sm align-middle" id="tablaVentas">
                <thead>
                  <tr><th>Fecha</th><th>Producto</th><th>Cant.</th><th>Cliente</th><th>Vendedor</th><th class="text-end">Total</th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

<footer class="footer-theja py-3 mt-4">
  <div class="container text-center">
    THEJA &copy; 2026 &middot; Herramienta web para Log&Aacute;stica Andina S.A.S.

  </div>
</footer>

  <script src="vendor/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/ventas.js"></script>
</body>
</html>
