  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="img/logo.png" alt="THEJA" class="logo-theja"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav" aria-controls="menuNav" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li><li class="nav-item"><a class="nav-link" href="ventas.html"><i class="bi bi-cart-plus me-1"></i>Ventas</a></li><li class="nav-item"><a class="nav-link" href="inventario.html"><i class="bi bi-boxes me-1"></i>Inventario</a></li><li class="nav-item"><a class="nav-link" href="procesamiento.html"><i class="bi bi-stack me-1"></i>Procesamiento</a></li><li class="nav-item"><a class="nav-link active" href="empleados.html"><i class="bi bi-people me-1"></i>Empleados</a></li><li class="nav-item"><a class="nav-link" href="manual.html"><i class="bi bi-journal-text me-1"></i>Manual</a></li>
      </ul>

  </div>
</nav>

  <main class="container py-4">
    <h2 class="page-title mb-4"><i class="bi bi-people me-2"></i>Empleados y desempeño</h2>

    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card">
          <div class="card-header"><i class="bi bi-person-plus me-2"></i>Registrar empleado</div>
          <div class="card-body">
            <form id="formEmpleado">
              <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="inpEmpNombre" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Cargo</label>
                <input type="text" class="form-control" id="inpEmpCargo" value="Vendedor">
              </div>
              <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" class="form-control" id="inpEmpCorreo">
              </div>
              <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="inpEmpTelefono">
              </div>
              <button class="btn btn-theja w-100" type="submit">Guardar empleado</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card">
          <div class="card-header"><i class="bi bi-bar-chart me-2"></i>Evaluación de desempeño comercial</div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-theja align-middle" id="tablaEmpleados">
                <thead>
                  <tr><th>Empleado</th><th>Cargo</th><th>Contacto</th><th class="text-end">Ventas</th><th class="text-end">Total vendido</th><th>Participación</th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

<footer class="footer-theja py-3 mt-4">

  </div>
</footer>

  <script src="js/main.js"></script>
  <script src="js/empleados.js"></script>
</body>
</html>
